<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnOcean — Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; padding: 40px; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%; max-width: 400px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
    .sub { color: #666; font-size: 14px; margin-bottom: 28px; }
    .sub strong { color: #333; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 18px;
      border: 1.5px solid #e0e0e0; border-radius: 8px;
      font-size: 15px; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #667eea; }
    input.otp {
      text-align: center; font-size: 24px;
      letter-spacing: 10px; font-weight: 700;
    }
    button {
      width: 100%; padding: 13px; background: #667eea; color: #fff;
      border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #5568d3; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.link {
      background: none; color: #667eea; padding: 8px;
      font-size: 13px; font-weight: 500; margin-top: 8px;
    }
    button.link:hover { background: none; text-decoration: underline; }
    .msg {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      font-size: 14px; display: none;
    }
    .msg.error { background: #fee; color: #c33; display: block; }
    .msg.success { background: #efe; color: #2a2; display: block; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- Step 1: Signup form -->
  <form class="card" id="signup-form">
    <h1>Create account</h1>
    <p class="explanation">We'll email you a code to verify.</p>

    <label for="name">Full name</label>
    <input id="name" name="name" type="text" required placeholder="Jane Doe" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required placeholder="johndoe@example.com" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters" />

    <button type="submit" id="submit-btn">Sign up</button>
    <div class="msg" id="msg"></div>
  </form>

  <!-- Step 2: OTP form -->
  <form class="card hidden" id="otp-form">
    <h1>Check your email</h1>
    <p class="sub">We sent a 6-digit code to <strong id="email-display"></strong></p>

    <label for="otp">Verification code</label>
    <input id="otp" name="otp" class="otp" type="text" inputmode="numeric"
           pattern="[0-9]{6}" maxlength="6" required placeholder="000000" />

    <button type="submit" id="verify-btn">Verify!</button>
    <button type="button" class="link" id="resend-btn">Resend code</button>
    <div class="msg" id="otp-msg"></div>
  </form>

  <script>
    const signupForm = document.getElementById('signup-form');
    const otpForm = document.getElementById('otp-form');
    const msg = document.getElementById('msg');
    const otpMsg = document.getElementById('otp-msg');
    const emailDisplay = document.getElementById('email-display');
    const submitBtn = document.getElementById('submit-btn');
    const verifyBtn = document.getElementById('verify-btn');
    const resendBtn = document.getElementById('resend-btn');

    let pendingEmail = '';

    /* ---- Step 1: submit signup ---- */
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending code…';

      const data = Object.fromEntries(new FormData(signupForm));

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Something went wrong');

        pendingEmail = data.email;
        emailDisplay.textContent = pendingEmail;
        signupForm.classList.add('hidden');
        otpForm.classList.remove('hidden');
        document.getElementById('otp').focus();
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign up';
      }
    });

    /* ---- Step 2: verify OTP ---- */
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      otpMsg.className = 'msg';
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying…';

      const code = document.getElementById('otp').value.trim();

      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, code }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Verification failed');

        otpMsg.className = 'msg success';
        otpMsg.textContent = json.message;
        verifyBtn.textContent = 'Verified ✓';
      } catch (err) {
        otpMsg.className = 'msg error';
        otpMsg.textContent = err.message;
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify';
      }
    });

    /* ---- Resend ---- */
    resendBtn.addEventListener('click', async () => {
      otpMsg.className = 'msg';
      resendBtn.disabled = true;
      try {
        const res = await fetch('/api/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail }),
        });
        const json = await res.json();
        otpMsg.className = res.ok ? 'msg success' : 'msg error';
        otpMsg.textContent = json.message || json.error;
      } catch {
        otpMsg.className = 'msg error';
        otpMsg.textContent = 'Network error.';
      } finally {
        resendBtn.disabled = false;
      }
    });

    /* ---- Only digits in OTP field ---- */
    document.getElementById('otp').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
    });
  </script>
</body>
</html>
